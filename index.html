<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Books Library | PDF Downloads</title>

    <meta name="description"
          content="Explore and download 48 PDF books from our digital library.">

    <style>
        /* =========================
           FONT
        ========================= */

        @font-face {
            font-family: 'BahijJalal';
            src: url('./Bahij%20Jalal-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        /* =========================
           ROOT COLORS
        ========================= */

        :root {
            --primary: #02DB50;
            --background: #02DB50;
            --white: #FFFFFF;
            --dark-green: #007C2D;
            --soft-white: rgba(255, 255, 255, 0.14);
            --border: rgba(255, 255, 255, 0.28);
        }

        /* =========================
           GLOBAL
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'BahijJalal', sans-serif;
            background: var(--background);
            color: var(--white);
            min-height: 100vh;
            line-height: 1.7;
        }

        button,
        input,
        a {
            font-family: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            padding: 30px 16px 24px;
            text-align: center;
            background: rgba(0, 0, 0, 0.06);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            width: 66px;
            height: 66px;
            border-radius: 20px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: rgba(255, 255, 255, 0.20);
            border: 1px solid var(--border);
        }

        .header h1 {
            font-size: clamp(25px, 5vw, 36px);
            font-weight: bold;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .book-counter {
            display: inline-block;
            margin-top: 15px;
            padding: 5px 17px;
            border: 1px solid var(--border);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.13);
            font-size: 13px;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 1150px;
            padding: 25px 16px 45px;
            margin: auto;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .section-description {
            font-size: 13px;
            opacity: 0.92;
            margin-bottom: 20px;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-box {
            margin-bottom: 25px;
            position: relative;
        }

        .search-box input {
            display: block;
            width: 100%;
            padding: 15px 18px;
            color: var(--white);
            background: rgba(0, 0, 0, 0.09);
            border: 1px solid var(--border);
            border-radius: 15px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.85);
        }

        .search-box input:focus {
            border-color: var(--white);
            background: rgba(0, 0, 0, 0.13);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
        }

        /* =========================
           BOOK GRID
        ========================= */

        .books-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        /* =========================
           BOOK CARD
        ========================= */

        .book-card {
            min-width: 0;
            padding: 19px 15px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.09);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition:
                transform 0.22s ease,
                background 0.22s ease,
                box-shadow 0.22s ease;
        }

        .book-card:hover {
            transform: translateY(-4px);
            background: rgba(0, 0, 0, 0.14);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.09);
        }

        .book-icon {
            width: 58px;
            height: 66px;
            margin-bottom: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid var(--border);
        }

        .book-number {
            display: inline-block;
            align-self: flex-start;
            padding: 2px 10px;
            margin-bottom: 9px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.16);
            font-size: 11px;
        }

        .book-title {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 14px;
            overflow-wrap: anywhere;
        }

        /* =========================
           TEXTVIEWS / BOOK DETAILS
        ========================= */

        .book-details {
            margin-bottom: 18px;
        }

        .detail-row {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.16);
        }

        .detail-label {
            display: block;
            font-size: 11px;
            opacity: 0.85;
            margin-bottom: 2px;
        }

        .detail-value {
            display: block;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        /* =========================
           DOWNLOAD BUTTON
        ========================= */

        .download-btn {
            margin-top: auto;
            width: 100%;
            min-height: 46px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            color: var(--dark-green);
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: #E8FFEF;
            transform: scale(1.02);
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .download-btn:focus-visible {
            outline: 3px solid var(--dark-green);
            outline-offset: 3px;
        }

        /* =========================
           LOADING / EMPTY STATE
        ========================= */

        .status-message {
            text-align: center;
            padding: 25px 12px;
            margin-top: 15px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.08);
            font-size: 14px;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            padding: 20px 15px;
            text-align: center;
            background: rgba(0, 0, 0, 0.07);
            border-top: 1px solid var(--border);
            font-size: 12px;
        }

        .footer p + p {
            margin-top: 4px;
        }

        /* =========================
           RESPONSIVE DESIGN
        ========================= */

        @media (max-width: 800px) {
            .books-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .book-card {
                padding: 15px 12px;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 20px 11px 35px;
            }

            .books-grid {
                gap: 9px;
            }

            .book-card {
                padding: 13px 10px;
                border-radius: 15px;
            }

            .book-title {
                font-size: 15px;
            }

            .detail-value {
                font-size: 12px;
            }

            .download-btn {
                font-size: 12px;
                padding: 9px 5px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo" aria-hidden="true">📚</div>

        <h1>Books Library</h1>

        <p>Your Digital Library — Read and Download</p>

        <div class="book-counter">
            Total Books: <span id="totalBooks">48</span>
        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main class="container">

        <h2 class="section-title">Available Books</h2>

        <p class="section-description">
            Browse the collection and download your favorite PDF books.
        </p>


        <!-- SEARCH BOX -->

        <div class="search-box">

            <input
                type="search"
                id="searchInput"
                placeholder="Search books by name or number..."
                aria-label="Search books"
                autocomplete="off"
            >

        </div>


        <!-- BOOKS GRID -->

        <section
            class="books-grid"
            id="booksGrid"
            aria-label="Available PDF books"
        ></section>


        <!-- EMPTY STATE -->

        <div class="status-message hidden" id="emptyMessage">
            No books found. Please try another search.
        </div>

        <div class="status-message hidden" id="loadingMessage">
            Loading book information...
        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <p>Books Library © <span id="currentYear"></span></p>

        <p>All available books are provided in PDF format.</p>

    </footer>


    <script>
        /* =====================================
           GITHUB REPOSITORY SETTINGS
        ===================================== */

        const GITHUB_USERNAME = "YOUR_USERNAME";

        const REPOSITORY_NAME = "YOUR_REPOSITORY";

        const BRANCH_NAME = "main";


        /* =====================================
           BOOK INFORMATION

           Replace these sample titles and
           authors with the real book details.
        ===================================== */

        const bookInformation = {

            1: {
                title: "Book 1",
                author: "Unknown"
            },

            2: {
                title: "Book 2",
                author: "Unknown"
            },

            3: {
                title: "Book 3",
                author: "Unknown"
            }

            /*
             * You can add the remaining books here.
             *
             * Example:
             *
             * 4: {
             *     title: "English Grammar",
             *     author: "John Smith"
             * },
             *
             * 5: {
             *     title: "Vocabulary Book",
             *     author: "Ali Ahmad"
             * }
             */

        };


        /* =====================================
           GENERATE BOOK URLS
        ===================================== */

        const rawBase =
            "https://raw.githubusercontent.com/" +
            GITHUB_USERNAME + "/" +
            REPOSITORY_NAME + "/" +
            BRANCH_NAME + "/";

        const downloadBase =
            "https://github.com/" +
            GITHUB_USERNAME + "/" +
            REPOSITORY_NAME +
            "/raw/refs/heads/" +
            BRANCH_NAME + "/";


        /* =====================================
           ELEMENTS
        ===================================== */

        const booksGrid = document.getElementById("booksGrid");

        const searchInput = document.getElementById("searchInput");

        const emptyMessage = document.getElementById("emptyMessage");

        const totalBooks = document.getElementById("totalBooks");


        /* =====================================
           CREATE BOOK CARD
        ===================================== */

        function createBookCard(number) {

            const fileName = "A" + number + ".pdf";

            const info = bookInformation[number] || {
                title: fileName,
                author: "Not specified"
            };

            const card = document.createElement("article");

            card.className = "book-card";

            card.dataset.search =
                (info.title + " " + info.author + " " +
                fileName + " " + number).toLowerCase();


            const icon = document.createElement("div");

            icon.className = "book-icon";

            icon.setAttribute("aria-hidden", "true");

            icon.textContent = "📖";


            const numberLabel = document.createElement("span");

            numberLabel.className = "book-number";

            numberLabel.textContent = "BOOK " + number;


            const title = document.createElement("h3");

            title.className = "book-title";

            title.textContent = info.title;


            /* BOOK DETAILS */

            const details = document.createElement("div");

            details.className = "book-details";


            const authorRow = document.createElement("div");

            authorRow.className = "detail-row";


            const authorLabel = document.createElement("span");

            authorLabel.className = "detail-label";

            authorLabel.textContent = "Author";


            const authorValue = document.createElement("span");

            authorValue.className = "detail-value";

            authorValue.textContent = info.author;


            authorRow.appendChild(authorLabel);

            authorRow.appendChild(authorValue);


            const sizeRow = document.createElement("div");

            sizeRow.className = "detail-row";


            const sizeLabel = document.createElement("span");

            sizeLabel.className = "detail-label";

            sizeLabel.textContent = "File Size";


            const sizeValue = document.createElement("span");

            sizeValue.className = "detail-value";

            sizeValue.textContent = "Checking...";

            sizeValue.dataset.size = "true";


            sizeRow.appendChild(sizeLabel);

            sizeRow.appendChild(sizeValue);


            details.appendChild(authorRow);

            details.appendChild(sizeRow);


            /* DOWNLOAD BUTTON */

            const downloadButton = document.createElement("a");

            downloadButton.className = "download-btn";

            downloadButton.href =
                downloadBase + encodeURIComponent(fileName);

            downloadButton.setAttribute("download", fileName);

            downloadButton.setAttribute(
                "aria-label",
                "Download " + info.title
            );

            downloadButton.innerHTML =
                '<span aria-hidden="true">⬇</span>' +
                '<span>Download PDF</span>';


            /* ASSEMBLE CARD */

            card.appendChild(icon);

            card.appendChild(numberLabel);

            card.appendChild(title);

            card.appendChild(details);

            card.appendChild(downloadButton);


            /* CHECK ACTUAL PDF SIZE */

            checkFileSize(
                rawBase + encodeURIComponent(fileName),
                sizeValue
            );


            return card;
        }


        /* =====================================
           CHECK PDF FILE SIZE

           Uses HTTP HEAD when supported.
           Falls back to a Range request.
        ===================================== */

        async function checkFileSize(url, target) {

            try {

                let response = await fetch(url, {
                    method: "HEAD"
                });

                let size = response.headers.get("Content-Length");

                if (!response.ok || !size) {

                    response = await fetch(url, {
                        headers: {
                            "Range": "bytes=0-0"
                        }
                    });

                    const range = response.headers.get("Content-Range");

                    if (range) {

                        const match = range.match(/\/(\d+)$/);

                        if (match) {
                            size = match[1];
                        }

                    } else if (response.status === 200) {

                        size = response.headers.get("Content-Length");

                    }

                }

                if (size && Number(size) > 0) {

                    target.textContent = formatFileSize(Number(size));

                } else {

                    target.textContent = "Unavailable";

                }

            } catch (error) {

                target.textContent = "Unavailable";

            }

        }


        /* =====================================
           FORMAT FILE SIZE
        ===================================== */

        function formatFileSize(bytes) {

            if (bytes < 1024) {
                return bytes + " B";
            }

            if (bytes < 1024 * 1024) {
                return (bytes / 1024).toFixed(1) + " KB";
            }

            if (bytes < 1024 * 1024 * 1024) {
                return (bytes / (1024 * 1024)).toFixed(2) + " MB";
            }

            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";

        }


        /* =====================================
           RENDER ALL 48 BOOKS
        ===================================== */

        function renderBooks() {

            const fragment = document.createDocumentFragment();

            for (let i = 1; i <= 48; i++) {

                fragment.appendChild(createBookCard(i));

            }

            booksGrid.replaceChildren(fragment);

            totalBooks.textContent = "48";

        }


        /* =====================================
           SEARCH BOOKS
        ===================================== */

        searchInput.addEventListener("input", function () {

            const query = searchInput.value
                .trim()
                .toLowerCase();

            const cards = booksGrid.querySelectorAll(".book-card");

            let visibleCount = 0;

            cards.forEach(function (card) {

                const matches = card.dataset.search.includes(query);

                card.classList.toggle("hidden", !matches);

                if (matches) {
                    visibleCount++;
                }

            });

            emptyMessage.classList.toggle("hidden", visibleCount !== 0);

            totalBooks.textContent = visibleCount;

        });


        /* =====================================
           INITIALIZE PAGE
        ===================================== */

        document.getElementById("currentYear").textContent =
            new Date().getFullYear();

        renderBooks();

    </script>

</body>
</html>
