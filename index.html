<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#02DB50">

  <title>اسلامي کتابتون</title>

  <style>
    @font-face {
      font-family: "Bahij";
      src: url("./Bahij%20Jalal-Bold.ttf") format("truetype");
      font-weight: bold;
      font-display: swap;
    }

    :root {
      --green: #02DB50;
      --background: #07130B;
      --card: #102018;
      --border: #245B38;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--white);
      font-family: "Bahij", Tahoma, Arial, sans-serif;
      line-height: 1.8;
    }

    .header {
      padding: 28px 15px;
      text-align: center;
      background: #0B1D11;
      border-bottom: 2px solid var(--green);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green);
      border-radius: 50%;
      font-size: 35px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      color: var(--white);
    }

    .header p {
      margin: 5px 0 0;
      color: var(--white);
      font-size: 15px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 22px 15px 35px;
    }

    .search-box {
      margin-bottom: 18px;
    }

    #searchInput {
      width: 100%;
      padding: 13px 15px;
      background: var(--card);
      color: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    #searchInput::placeholder {
      color: var(--white);
      opacity: 0.8;
    }

    #searchInput:focus {
      border-color: var(--green);
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .summary span {
      padding: 7px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--white);
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
    }

    .book-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .book-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .book-icon {
      flex-shrink: 0;
      width: 48px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green);
      border-radius: 8px;
      font-size: 25px;
    }

    .book-heading {
      min-width: 0;
    }

    .book-number {
      margin: 0;
      color: var(--white);
      font-size: 13px;
    }

    .book-title {
      margin: 2px 0 0;
      color: var(--white);
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .book-details {
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin: 5px 0;
      font-size: 14px;
    }

    .detail-label {
      color: var(--white);
      flex-shrink: 0;
    }

    .detail-value {
      color: var(--white);
      text-align: left;
      overflow-wrap: anywhere;
    }

    .download-btn {
      display: block;
      width: 100%;
      margin-top: auto;
      padding: 10px 12px;
      background: var(--green);
      color: var(--white);
      border: 0;
      border-radius: 9px;
      text-align: center;
      text-decoration: none;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .download-btn:active {
      opacity: 0.8;
    }

    .empty-message {
      display: none;
      padding: 25px 10px;
      text-align: center;
      color: var(--white);
    }

    .footer {
      margin-top: 15px;
      padding: 18px 10px;
      text-align: center;
      border-top: 1px solid var(--border);
      color: var(--white);
      font-size: 14px;
    }

    @media (max-width: 800px) {
      .books-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .header h1 {
        font-size: 25px;
      }

      .container {
        padding: 15px 12px 25px;
      }

      .books-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">📚</div>
    <h1>اسلامي کتابتون</h1>
    <p>د اسلامي کتابونو د ترلاسه کولو او لوستلو ځای</p>
  </header>

  <main class="container">

    <div class="search-box">
      <input
        type="search"
        id="searchInput"
        placeholder="د کتاب نوم یا شمېره ولټوئ..."
        aria-label="د کتابونو لټون"
        autocomplete="off"
      >
    </div>

    <div class="summary">
      <span>ټول کتابونه: <strong id="totalBooks">۴۸</strong></span>
      <span>د فایل بڼه: PDF</span>
    </div>

    <section
      id="booksGrid"
      class="books-grid"
      aria-label="د کتابونو لېست">
    </section>

    <div id="emptyMessage" class="empty-message">
      کتاب ونه موندل شو.
    </div>

  </main>

  <footer class="footer">
    اسلامي کتابتون © <span id="currentYear"></span>
  </footer>

  <script>
    "use strict";

    const SITE_URL =
      "https://tamkeendevhub-netizen.github.io/Islamic-library-/";

    const TOTAL_BOOKS = 48;

    const PASHTO_DIGITS = [
      "۰", "۱", "۲", "۳", "۴",
      "۵", "۶", "۷", "۸", "۹"
    ];

    const ORDINALS = [
      "لومړی", "دویم", "درېیم", "څلورم", "پنځم",
      "شپږم", "اووم", "اتم", "نهم", "لسم",
      "یوولسم", "دولسم", "دیارلسم", "څوارلسم", "پنځلسم",
      "شپاړسم", "اوولسم", "اتلسم", "نولسم", "شلم",
      "یوویشتم", "دوه ویشتم", "درې ویشتم", "څلور ویشتم",
      "پنځه ویشتم", "شپږ ویشتم", "اووه ویشتم",
      "اته ویشتم", "نهه ویشتم", "دېرشم",
      "یو دېرشم", "دوه دېرشم", "درې دېرشم",
      "څلور دېرشم", "پنځه دېرشم", "شپږ دېرشم",
      "اووه دېرشم", "اته دېرشم", "نهه دېرشم",
      "څلوېښتم", "یو څلوېښتم", "دوه څلوېښتم",
      "درې څلوېښتم", "څلور څلوېښتم", "پنځه څلوېښتم",
      "شپږ څلوېښتم", "اووه څلوېښتم", "اته څلوېښتم"
    ];

    /*
      د کتابونو اصلي نومونه او لیکوالان دلته ولیکه.
      د مثال په توګه:
      1: { title: "د کتاب اصلي نوم", author: "د لیکوال نوم" }
    */

    const BOOK_INFO = {
      1:  { title: "لومړی کتاب", author: "نامعلوم" },
      2:  { title: "دویم کتاب", author: "نامعلوم" },
      3:  { title: "درېیم کتاب", author: "نامعلوم" },
      4:  { title: "څلورم کتاب", author: "نامعلوم" },
      5:  { title: "پنځم کتاب", author: "نامعلوم" },
      6:  { title: "شپږم کتاب", author: "نامعلوم" },
      7:  { title: "اووم کتاب", author: "نامعلوم" },
      8:  { title: "اتم کتاب", author: "نامعلوم" },
      9:  { title: "نهم کتاب", author: "نامعلوم" },
      10: { title: "لسم کتاب", author: "نامعلوم" }
    };

    const booksGrid = document.getElementById("booksGrid");
    const searchInput = document.getElementById("searchInput");
    const totalBooks = document.getElementById("totalBooks");
    const emptyMessage = document.getElementById("emptyMessage");

    function toPashtoNumber(number) {
      return String(number).replace(/[0-9]/g, function (digit) {
        return PASHTO_DIGITS[Number(digit)];
      });
    }

    function getBookTitle(number) {
      if (BOOK_INFO[number] && BOOK_INFO[number].title) {
        return BOOK_INFO[number].title;
      }

      return ORDINALS[number - 1] + " کتاب";
    }

    function getBookAuthor(number) {
      if (BOOK_INFO[number] && BOOK_INFO[number].author) {
        return BOOK_INFO[number].author;
      }

      return "نامعلوم";
    }

    function createElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined && text !== null) {
        element.textContent = text;
      }

      return element;
    }

    function addDetailRow(parent, label, value) {
      const row = createElement("div", "detail-row");
      const labelElement = createElement("span", "detail-label", label);
      const valueElement = createElement("span", "detail-value", value);

      row.appendChild(labelElement);
      row.appendChild(valueElement);
      parent.appendChild(row);
    }

    function createBookCard(number) {
      const card = createElement("article", "book-card");

      const bookName = getBookTitle(number);
      const author = getBookAuthor(number);
      const fileName = "A" + number + ".pdf";

      /*
        د PDF فایل مستقیم لینک.
        د فایل نومونه باید په Repository کې عیناً
        A1.pdf، A2.pdf ... A48.pdf وي.
      */

      const fileUrl = new URL(fileName, SITE_URL).href;

      const top = createElement("div", "book-top");
      const icon = createElement("div", "book-icon", "📖");
      const heading = createElement("div", "book-heading");

      const numberLabel = createElement(
        "p",
        "book-number",
        "د کتاب شمېره: " + toPashtoNumber(number)
      );

      const title = createElement("h2", "book-title", bookName);

      heading.appendChild(numberLabel);
      heading.appendChild(title);

      top.appendChild(icon);
      top.appendChild(heading);

      const details = createElement("div", "book-details");

      addDetailRow(details, "د کتاب نوم:", bookName);
      addDetailRow(details, "لیکوال:", author);
      addDetailRow(details, "د فایل نوم:", fileName);
      addDetailRow(details, "د فایل بڼه:", "PDF");

      const downloadButton = createElement(
        "a",
        "download-btn",
        "⬇ ډاونلوډ"
      );

      downloadButton.href = fileUrl;
      downloadButton.setAttribute("download", fileName);
      downloadButton.setAttribute("target", "_blank");
      downloadButton.setAttribute("rel", "noopener noreferrer");

      downloadButton.addEventListener("click", function (event) {
        /*
          د لینک له کلیک کولو وروسته براوزر د PDF
          فایل خلاصوي یا یې ډاونلوډ کوي.
          د GitHub Pages له لارې د download ځانګړنه
          په ټولو براوزرونو کې حتمي نه ده.
        */
        if (!downloadButton.href) {
          event.preventDefault();
          alert("د کتاب لینک پیدا نه شو.");
        }
      });

      card.appendChild(top);
      card.appendChild(details);
      card.appendChild(downloadButton);

      return card;
    }

    function renderBooks(searchText) {
      const query = (searchText || "").trim().toLowerCase();

      booksGrid.innerHTML = "";

      let visibleCount = 0;

      for (let number = 1; number <= TOTAL_BOOKS; number++) {
        const title = getBookTitle(number);
        const author = getBookAuthor(number);
        const fileName = "A" + number + ".pdf";

        const searchableText = (
          title + " " +
          author + " " +
          fileName + " " +
          number + " " +
          toPashtoNumber(number)
        ).toLowerCase();

        if (query !== "" && !searchableText.includes(query)) {
          continue;
        }

        booksGrid.appendChild(createBookCard(number));
        visibleCount++;
      }

      totalBooks.textContent = toPashtoNumber(visibleCount);

      emptyMessage.style.display =
        visibleCount === 0 ? "block" : "none";
    }

    searchInput.addEventListener("input", function () {
      renderBooks(searchInput.value);
    });

    document.getElementById("currentYear").textContent =
      toPashtoNumber(new Date().getFullYear());

    renderBooks("");
  </script>

</body>
</html>
