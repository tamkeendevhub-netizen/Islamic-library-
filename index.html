<html lang="ps" dir="rtl">

<head>

          content="اسلامي کتابتون؛ د اسلامي کتابونو د لوستلو او ښکته کولو لپاره یوه ډیجیټلي ټولګه.">

    <meta name="theme-color" content="#02DB50">

    <style>

        /* =========================
           د فونټ تنظیمات
        ========================= */

        @font-face {
            font-family: 'BahijJalal';
            src: url('./Bahij%20Jalal-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        /* =========================
           اصلي رنګونه
        ========================= */

        :root {
            --primary: #02DB50;
            --white: #FFFFFF;
            --dark-green: #007C2D;
            --light-white: rgba(255, 255, 255, 0.15);
            --border: rgba(255, 255, 255, 0.30);
        }

        /* =========================
           عمومي تنظیمات
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'BahijJalal', sans-serif;
            background: var(--primary);
            color: var(--white);
            min-height: 100vh;
            line-height: 1.8;
        }

        button,
        input,
        a {
            font-family: 'BahijJalal', sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           د پاڼې سر
        ========================= */

        .header {
            padding: 32px 16px 26px;
            text-align: center;
            background: rgba(0, 0, 0, 0.06);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 12px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            background: var(--light-white);
            border: 1px solid var(--border);
        }

        .header h1 {
            font-size: clamp(27px, 5vw, 38px);
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
        }

        .book-counter {
            display: inline-block;
            margin-top: 15px;
            padding: 5px 18px;
            border: 1px solid var(--border);
            border-radius: 50px;
            background: var(--light-white);
            font-size: 13px;
        }

        /* =========================
           اصلي کانټینر
        ========================= */

        .container {
            width: 100%;
            max-width: 1150px;
            padding: 26px 16px 45px;
            margin: auto;
        }

        .section-title {
            font-size: 23px;
            margin-bottom: 5px;
        }

        .section-description {
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* =========================
           د لټون برخه
        ========================= */

        .search-box {
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 17px;
            color: var(--white);
            background: rgba(0, 0, 0, 0.09);
            border: 1px solid var(--border);
            border-radius: 15px;
            outline: none;
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.90);
        }

        .search-box input:focus {
            border-color: var(--white);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
        }

        /* =========================
           د کتابونو شبکه
        ========================= */

        .books-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        /* =========================
           د کتاب کارت
        ========================= */

        .book-card {
            min-width: 0;
            padding: 19px 15px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.09);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.22s ease,
                        background 0.22s ease,
                        box-shadow 0.22s ease;
        }

        .book-card:hover {
            transform: translateY(-4px);
            background: rgba(0, 0, 0, 0.14);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.09);
        }

        .book-icon {
            width: 60px;
            height: 66px;
            margin-bottom: 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background: var(--light-white);
            border: 1px solid var(--border);
        }

        .book-number {
            display: inline-block;
            align-self: flex-start;
            padding: 3px 11px;
            margin-bottom: 9px;
            border-radius: 30px;
            background: var(--light-white);
            font-size: 12px;
        }

        .book-title {
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 13px;
            overflow-wrap: anywhere;
        }

        /* =========================
           د کتاب معلومات
        ========================= */

        .book-details {
            margin-bottom: 18px;
        }

        .detail-row {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        }

        .detail-label {
            display: block;
            font-size: 12px;
            opacity: 0.90;
            margin-bottom: 2px;
        }

        .detail-value {
            display: block;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        /* =========================
           د ښکته کولو تڼۍ
        ========================= */

        .download-btn {
            margin-top: auto;
            width: 100%;
            min-height: 47px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.80);
            color: var(--dark-green);
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: #E8FFEF;
            transform: scale(1.02);
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        /* =========================
           د لټون پایله
        ========================= */

        .status-message {
            text-align: center;
            padding: 24px 12px;
            margin-top: 15px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.08);
            font-size: 14px;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           د پاڼې پای
        ========================= */

        .footer {
            padding: 20px 15px;
            text-align: center;
            background: rgba(0, 0, 0, 0.07);
            border-top: 1px solid var(--border);
            font-size: 12px;
        }

        .footer p + p {
            margin-top: 4px;
        }

        /* =========================
           د ټیلیفون تنظیمات
        ========================= */

        @media (max-width: 800px) {

            .books-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .book-card {
                padding: 15px 12px;
            }

        }

        @media (max-width: 420px) {

            .container {
                padding: 20px 11px 35px;
            }

            .books-grid {
                gap: 9px;
            }

            .book-card {
                padding: 13px 10px;
                border-radius: 15px;
            }

            .book-title {
                font-size: 15px;
            }

            .detail-value {
                font-size: 12px;
            }

            .download-btn {
                font-size: 12px;
                padding: 9px 5px;
            }

        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition: none !important;
            }

        }

    </style>

</head>

    <script>

        /* ==================================
           د ګیټ‌هاب تنظیمات

        const GITHUB_USERNAME = "YOUR_USERNAME";

        const BRANCH_NAME = "main";


        /* ==================================
           د پښتو شمېرې
        ================================== */

        const pashtoDigits = [
            "۰", "۱", "۲", "۳", "۴",
            "۵", "۶", "۷", "۸", "۹"
        ];

        function toPashtoNumber(number) {

            return String(number).replace(/[0-9]/g, function (digit) {
                return pashtoDigits[Number(digit)];
            });

        }


        /* ==================================
           د کتابونو نومونه او لیکوالان

           د هر کتاب اصلي معلومات دلته ولیکئ.
        ================================== */

                author: "نامعلوم"
            },

            2: {
                title: "دویم کتاب",
                author: "نامعلوم"
            },

            3: {
                title: "درېیم کتاب",
                author: "نامعلوم"
            }

            /*
             * د نورو کتابونو د معلوماتو بېلګه:
             *
             * ,4: {
             *     title: "د کتاب اصلي نوم",
             *     author: "د لیکوال نوم"
             * }
             *
             * ,5: {
             *     title: "د بل کتاب نوم",
             *     author: "د لیکوال نوم"
             * }
             */

        /* ==================================

        const rawBase =

        /* ==================================

        ================================== */

        const booksGrid = document.getElementById("booksGrid");

        const searchInput = document.getElementById("searchInput");

        const emptyMessage = document.getElementById("emptyMessage");

        const totalBooks = document.getElementById("totalBooks");


        /* ==================================
           د کتاب کارت جوړول
        ================================== */

        function createBookCard(number) {

            const fileName = "A" + number + ".pdf";

            const ordinalNames = {
                1: "لومړی کتاب",
                2: "دویم کتاب",
                3: "درېیم کتاب",
                4: "څلورم کتاب",
                5: "پنځم کتاب",
                6: "شپږم کتاب",
                7: "اووم کتاب",
                8: "اتم کتاب",
                9: "نهم کتاب",
                10: "لسم کتاب"
            };

            const info = bookInformation[number] || {
                title: ordinalNames[number] ||
                       toPashtoNumber(number) + "م کتاب",
                author: "نامعلوم"
            };


            const card = document.createElement("article");

            card.className = "book-card";

            card.dataset.search = (
                info.title + " " +
                info.author + " " +
                fileName + " " +
                number + " " +
                toPashtoNumber(number)
            ).toLowerCase();


            /* د کتاب نښه */

            const icon = document.createElement("div");

            icon.className = "book-icon";

            icon.setAttribute("aria-hidden", "true");

            icon.textContent = "📖";


            /* د کتاب شمېره */

            const numberLabel = document.createElement("span");

            numberLabel.className = "book-number";

            numberLabel.textContent =
                "کتاب " + toPashtoNumber(number);


            /* د کتاب نوم */

            const title = document.createElement("h3");

            title.className = "book-title";

            title.textContent = info.title;


            /* د کتاب معلومات */

            const details = document.createElement("div");

            details.className = "book-details";


            /* د لیکوال نوم */

            const authorRow = document.createElement("div");

            authorRow.className = "detail-row";


            const authorLabel = document.createElement("span");

            authorLabel.className = "detail-label";

            authorLabel.textContent = "د کتاب لیکوال";


            const authorValue = document.createElement("span");

            authorValue.className = "detail-value";

            authorValue.textContent = info.author;


            authorRow.appendChild(authorLabel);

            authorRow.appendChild(authorValue);


            /* د فایل حجم */

            const sizeRow = document.createElement("div");

            sizeRow.className = "detail-row";


            const sizeLabel = document.createElement("span");

            sizeLabel.className = "detail-label";

            sizeLabel.textContent = "د فایل حجم";


            const sizeValue = document.createElement("span");

            sizeValue.className = "detail-value";

            sizeValue.textContent = "د معلومولو په حال کې...";


            sizeRow.appendChild(sizeLabel);

            sizeRow.appendChild(sizeValue);


            details.appendChild(authorRow);

            details.appendChild(sizeRow);


            /* د ښکته کولو تڼۍ */

            const downloadButton = document.createElement("a");

            downloadButton.className = "download-btn";

            downloadButton.href =
                downloadBase + encodeURIComponent(fileName);

            downloadButton.setAttribute("download", fileName);

            downloadButton.setAttribute(
                "aria-label",
                info.title + " ښکته کړئ"
            );


            const downloadIcon = document.createElement("span");

            downloadIcon.textContent = "⬇";

            downloadIcon.setAttribute("aria-hidden", "true");


            const downloadText = document.createElement("span");

            downloadText.textContent = "کتاب ښکته کړئ";


            downloadButton.appendChild(downloadIcon);

            downloadButton.appendChild(downloadText);


            /* عناصر سره یوځای کول */

            card.appendChild(icon);

            card.appendChild(numberLabel);

            card.appendChild(title);

            card.appendChild(details);

            card.appendChild(downloadButton);


            /* د فایل حجم معلومول */

            checkFileSize(
                rawBase + encodeURIComponent(fileName),
                sizeValue
            );


            return card;

        }


        /* ==================================
           د فایل حجم معلومول
        ================================== */

        async function checkFileSize(url, target) {

            try {

                let size = null;

                let response = await fetch(url, {
                    method: "HEAD"
                });


                if (response.ok) {

                    size = response.headers.get("Content-Length");

                }


                if (!size || !response.ok) {

                    response = await fetch(url, {
                        headers: {
                            "Range": "bytes=0-0"
                        }
                    });


                    const range = response.headers.get("Content-Range");


                    if (range) {

                        const match = range.match(/\/(\d+)$/);

                        if (match) {
                            size = match[1];
                        }

                    } else if (response.ok) {

                        size = response.headers.get("Content-Length");

                    }

                }


                if (size && Number(size) > 0) {

                    target.textContent =
                        formatFileSize(Number(size));

                } else {

                    target.textContent = "حجم معلوم نه شو";

                }

            } catch (error) {

                target.textContent = "حجم معلوم نه شو";

            }

        }


        /* ==================================
           د فایل حجم په پښتو ښودل
        ================================== */

        function formatFileSize(bytes) {

            if (bytes < 1024) {

                return toPashtoNumber(bytes) + " بایټ";

            }


            if (bytes < 1024 * 1024) {

                return toPashtoNumber(
                    (bytes / 1024).toFixed(1)
                ) + " کیلوبایټ";

            }


            if (bytes < 1024 * 1024 * 1024) {

                return toPashtoNumber(
                    (bytes / (1024 * 1024)).toFixed(2)
                ) + " مېګابایټ";

            }


            return toPashtoNumber(
                (bytes / (1024 * 1024 * 1024)).toFixed(2)
            ) + " ګیګابایټ";

        }

    <script>
        /* =====================================

        ===================================== */

        const GITHUB_USERNAME = "YOUR_USERNAME";

        const REPOSITORY_NAME = "YOUR_REPOSITORY";

        const BRANCH_NAME = "main";


        /* =====================================

        ===================================== */

        const bookInformation = {

            1: {

                author: "Unknown"
            },

            2: {
                title: "Book 2",
                author: "Unknown"
            },

            3: {
                title: "Book 3",

            }

            /*

             *

             *     author: "John Smith"
             * },
             *
             * 5: {
             *     title: "Vocabulary Book",
             *     author: "Ali Ahmad"
             * }
             */

        };


        /* =====================================
           GENERATE BOOK URLS
        ===================================== */

        const rawBase =
            "https://raw.githubusercontent.com/" +
            GITHUB_USERNAME + "/" +
            REPOSITORY_NAME + "/" +
            BRANCH_NAME + "/";

        const downloadBase =
            "https://github.com/" +
            GITHUB_USERNAME + "/" +
            REPOSITORY_NAME +
            "/raw/refs/heads/" +
            BRANCH_NAME + "/";


        /* =====================================
           ELEMENTS
        ===================================== */

        const booksGrid = document.getElementById("booksGrid");

        const searchInput = document.getElementById("searchInput");

        const emptyMessage = document.getElementById("emptyMessage");

        const totalBooks = document.getElementById("totalBooks");


        /* =====================================
           CREATE BOOK CARD
        ===================================== */

        function createBookCard(number) {

            const fileName = "A" + number + ".pdf";

            const info = bookInformation[number] || {
                title: fileName,
                author: "Not specified"
            };

            const card = document.createElement("article");

            card.className = "book-card";

            card.dataset.search =
                (info.title + " " + info.author + " " +
                fileName + " " + number).toLowerCase();


            const icon = document.createElement("div");

            icon.className = "book-icon";

            icon.setAttribute("aria-hidden", "true");

            const numberLabel = document.createElement("span");

            numberLabel.className = "book-number";

            numberLabel.textContent = "BOOK " + number;


            const title = document.createElement("h3");

            title.className = "book-title";

            title.textContent = info.title;


            /* BOOK DETAILS */

            const details = document.createElement("div");

            details.className = "book-details";

        /* =====================================
           CHECK PDF FILE SIZE

           Uses HTTP HEAD when supported.
           Falls back to a Range request.
        ===================================== */

        async function checkFileSize(url, target) {

            try {

                let response = await fetch(url, {
                    method: "HEAD"
                });

                let size = response.headers.get("Content-Length");

                if (!response.ok || !size) {

                    response = await fetch(url, {
                        headers: {
                            "Range": "bytes=0-0"
                        }
                    });

                    const range = response.headers.get("Content-Range");

                    if (range) {

                        const match = range.match(/\/(\d+)$/);

                        if (match) {
                            size = match[1];
                        }

                    } else if (response.status === 200) {

                        size = response.headers.get("Content-Length");

                    }

                }

                if (size && Number(size) > 0) {

                    target.textContent = formatFileSize(Number(size));

                } else {

                    target.textContent = "Unavailable";

                }

            } catch (error) {

                target.textContent = "Unavailable";

            }

        }


        /* =====================================
           FORMAT FILE SIZE
        ===================================== */

        function formatFileSize(bytes) {

            if (bytes < 1024) {
                return bytes + " B";
            }

            if (bytes < 1024 * 1024) {
                return (bytes / 1024).toFixed(1) + " KB";
            }

            if (bytes < 1024 * 1024 * 1024) {
                return (bytes / (1024 * 1024)).toFixed(2) + " MB";
            }

            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";

        }


        /* =====================================
           RENDER ALL 48 BOOKS
        ===================================== */

        function renderBooks() {

            const fragment = document.createDocumentFragment();

            for (let i = 1; i <= 48; i++) {

                fragment.appendChild(createBookCard(i));

            }

            booksGrid.replaceChildren(fragment);

            totalBooks.textContent = "48";

        }


        /* =====================================
           SEARCH BOOKS
        ===================================== */

        searchInput.addEventListener("input", function () {

            const query = searchInput.value
                .trim()
                .toLowerCase();

            const cards = booksGrid.querySelectorAll(".book-card");

            let visibleCount = 0;

            cards.forEach(function (card) {

                const matches = card.dataset.search.includes(query);

                card.classList.toggle("hidden", !matches);

                if (matches) {
                    visibleCount++;
                }

            });

            emptyMessage.classList.toggle("hidden", visibleCount !== 0);

            totalBooks.textContent = visibleCount;

        });


        /* =====================================
           INITIALIZE PAGE
        ===================================== */

        document.getElementById("currentYear").textContent =
            new Date().getFullYear();

        renderBooks();

    </script>

</body>
</html>
