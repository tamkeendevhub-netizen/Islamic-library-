<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اسلامي کتابتون</title>

  <style>
    @font-face {
      font-family: "Bahij";
      src: url("Bahij%20Jalal-Bold.ttf") format("truetype");
      font-weight: bold;
      font-display: swap;
    }

    :root {
      --main-color: #02DB50;
      --background: #07130B;
      --card-background: #102018;
      --border-color: #245B38;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--white);
      font-family: "Bahij", Tahoma, Arial, sans-serif;
      line-height: 1.8;
    }

    button,
    input {
      font-family: inherit;
    }

    .header {
      text-align: center;
      padding: 30px 15px 25px;
      background: #0B1D11;
      border-bottom: 2px solid var(--main-color);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--main-color);
      color: #FFFFFF;
      font-size: 38px;
      font-weight: bold;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      color: #FFFFFF;
    }

    .header p {
      margin: 7px 0 0;
      color: #FFFFFF;
      font-size: 15px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 22px 15px 40px;
    }

    .search-box {
      margin-bottom: 18px;
    }

    #searchInput {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--card-background);
      color: #FFFFFF;
      font-size: 16px;
      outline: none;
    }

    #searchInput::placeholder {
      color: #FFFFFF;
      opacity: 0.8;
    }

    #searchInput:focus {
      border-color: var(--main-color);
      box-shadow: 0 0 0 2px rgba(2, 219, 80, 0.15);
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      color: #FFFFFF;
    }

    .summary span {
      background: var(--card-background);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 7px 13px;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .book-card {
      min-width: 0;
      padding: 17px;
      border: 1px solid var(--border-color);
      border-radius: 15px;
      background: var(--card-background);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .book-card:hover {
      border-color: var(--main-color);
      transform: translateY(-2px);
    }

    .book-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .book-icon {
      flex-shrink: 0;
      width: 48px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--main-color);
      color: #FFFFFF;
      border-radius: 8px;
      font-size: 25px;
    }

    .book-heading {
      min-width: 0;
    }

    .book-number {
      margin: 0;
      color: #FFFFFF;
      font-size: 14px;
    }

    .book-title {
      margin: 2px 0 0;
      color: #FFFFFF;
      font-size: 19px;
      overflow-wrap: anywhere;
    }

    .book-details {
      border-top: 1px solid var(--border-color);
      padding-top: 9px;
    }

    .detail-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin: 5px 0;
      font-size: 14px;
    }

    .detail-label {
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .detail-value {
      color: #FFFFFF;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .download-btn {
      display: block;
      width: 100%;
      margin-top: auto;
      padding: 11px 12px;
      border: none;
      border-radius: 9px;
      background: var(--main-color);
      color: #FFFFFF;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .download-btn:hover {
      filter: brightness(0.93);
    }

    .empty-message {
      display: none;
      text-align: center;
      padding: 30px 10px;
      color: #FFFFFF;
    }

    .footer {
      padding: 20px 10px;
      text-align: center;
      border-top: 1px solid var(--border-color);
      color: #FFFFFF;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      .books-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .header {
        padding: 24px 12px;
      }

      .header h1 {
        font-size: 25px;
      }

      .container {
        padding: 16px 12px 30px;
      }

      .books-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .book-card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo" aria-hidden="true">📚</div>
    <h1>اسلامي کتابتون</h1>
    <p>د اسلامي کتابونو د لوستلو او ترلاسه کولو ځای</p>
  </header>

  <main class="container">

    <div class="search-box">
      <input
        type="search"
        id="searchInput"
        placeholder="د کتاب نوم یا شمېره ولټوئ..."
        aria-label="د کتابونو لټون"
        autocomplete="off"
      >
    </div>

    <div class="summary">
      <span>ټول کتابونه: <strong id="totalBooks">۴۸</strong></span>
      <span>د کتابونو بڼه: PDF</span>
    </div>

    <section id="booksGrid" class="books-grid" aria-label="د کتابونو لېست"></section>

    <div id="emptyMessage" class="empty-message">
      دا کتاب ونه موندل شو.
    </div>

  </main>

  <footer class="footer">
    اسلامي کتابتون — <span id="currentYear"></span>
  </footer>

  <script>
    "use strict";

    /*
      مهم:
      GITHUB_USERNAME د خپل GitHub حساب په نوم بدل کړه.
      REPOSITORY_NAME د خپل Repository په نوم بدل کړه.
      فایلونه باید د Repository په main څانګه کې وي.
    */

    const GITHUB_USERNAME = "YOUR_USERNAME";
    const REPOSITORY_NAME = "YOUR_REPOSITORY";
    const BRANCH_NAME = "main";

    const TOTAL_BOOKS = 48;

    const PASHTO_DIGITS = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];

    const ORDINALS = [
      "لومړی", "دویم", "درېیم", "څلورم", "پنځم",
      "شپږم", "اووم", "اتم", "نهم", "لسم",
      "یوولسم", "دولسم", "دیارلسم", "څوارلسم", "پنځلسم",
      "شپاړسم", "اوولسم", "اتلسم", "نولسم", "شلم",
      "یوویشتم", "دوه ویشتم", "درې ویشتم", "څلور ویشتم",
      "پنځه ویشتم", "شپږ ویشتم", "اووه ویشتم",
      "اته ویشتم", "نهه ویشتم", "دېرشم",
      "یو دېرشم", "دوه دېرشم", "درې دېرشم",
      "څلور دېرشم", "پنځه دېرشم", "شپږ دېرشم",
      "اووه دېرشم", "اته دېرشم", "نهه دېرشم",
      "څلوېښتم", "یو څلوېښتم", "دوه څلوېښتم",
      "درې څلوېښتم", "څلور څلوېښتم", "پنځه څلوېښتم",
      "شپږ څلوېښتم", "اووه څلوېښتم", "اته څلوېښتم"
    ];

    /*
      دلته د کتابونو اصلي نومونه او د لیکوال نومونه ولیکه.
      اوس د هغو کتابونو لپاره چې معلومات یې نه دي ورکړل شوي،
      عمومي نوم او "نامعلوم" ښکاري.
    */

    const BOOK_INFO = {
      1:  { title: "لومړی کتاب", author: "نامعلوم" },
      2:  { title: "دویم کتاب", author: "نامعلوم" },
      3:  { title: "درېیم کتاب", author: "نامعلوم" },
      4:  { title: "څلورم کتاب", author: "نامعلوم" },
      5:  { title: "پنځم کتاب", author: "نامعلوم" },
      6:  { title: "شپږم کتاب", author: "نامعلوم" },
      7:  { title: "اووم کتاب", author: "نامعلوم" },
      8:  { title: "اتم کتاب", author: "نامعلوم" },
      9:  { title: "نهم کتاب", author: "نامعلوم" },
      10: { title: "لسم کتاب", author: "نامعلوم" }
    };

    const booksGrid = document.getElementById("booksGrid");
    const searchInput = document.getElementById("searchInput");
    const totalBooks = document.getElementById("totalBooks");
    const emptyMessage = document.getElementById("emptyMessage");

    function toPashtoNumber(number) {
      return String(number).replace(/[0-9]/g, function (digit) {
        return PASHTO_DIGITS[Number(digit)];
      });
    }

    function formatFileSize(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) {
        return "نه ده معلومه";
      }

      if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
      }

      return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    }

    function getBookTitle(number) {
      if (BOOK_INFO[number] && BOOK_INFO[number].title) {
        return BOOK_INFO[number].title;
      }

      return ORDINALS[number - 1] + " کتاب";
    }

    function getBookAuthor(number) {
      if (BOOK_INFO[number] && BOOK_INFO[number].author) {
        return BOOK_INFO[number].author;
      }

      return "نامعلوم";
    }

    function createElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined && text !== null) {
        element.textContent = text;
      }

      return element;
    }

    function addDetailRow(parent, label, value) {
      const row = createElement("div", "detail-row");
      const labelElement = createElement("span", "detail-label", label);
      const valueElement = createElement("span", "detail-value", value);

      row.appendChild(labelElement);
      row.appendChild(valueElement);
      parent.appendChild(row);
    }

    function createBookCard(number) {
      const card = createElement("article", "book-card");

      const bookName = getBookTitle(number);
      const author = getBookAuthor(number);
      const fileName = "A" + number + ".pdf";

      const rawUrl =
        "https://raw.githubusercontent.com/" +
        encodeURIComponent(GITHUB_USERNAME) + "/" +
        encodeURIComponent(REPOSITORY_NAME) + "/" +
        BRANCH_NAME + "/" + fileName;

      const filePageUrl =
        "https://github.com/" +
        encodeURIComponent(GITHUB_USERNAME) + "/" +
        encodeURIComponent(REPOSITORY_NAME) +
        "/blob/" + BRANCH_NAME + "/" + fileName;

      const top = createElement("div", "book-top");
      const icon = createElement("div", "book-icon", "📖");
      const heading = createElement("div", "book-heading");

      const numberLabel = createElement(
        "p",
        "book-number",
        "د کتاب شمېره: " + toPashtoNumber(number)
      );

      const title = createElement("h2", "book-title", bookName);

      heading.appendChild(numberLabel);
      heading.appendChild(title);

      top.appendChild(icon);
      top.appendChild(heading);

      const details = createElement("div", "book-details");

      addDetailRow(details, "د کتاب نوم:", bookName);
      addDetailRow(details, "لیکوال:", author);
      addDetailRow(details, "د فایل نوم:", fileName);
      addDetailRow(details, "د فایل اندازه:", "د ترلاسه کولو پر مهال معلومېږي");

      const downloadButton = createElement(
        "a",
        "download-btn",
        "⬇ ډاونلوډ"
      );

      downloadButton.href = rawUrl;
      downloadButton.target = "_blank";
      downloadButton.rel = "noopener noreferrer";
      downloadButton.setAttribute("aria-label", bookName + " ډاونلوډ");

      /*
        د GitHub د Raw فایل URL په ځینو موبایل براوزرونو کې
        د ډاونلوډ پر ځای فایل پرانیزي. دا عادي خبره ده.
      */

      downloadButton.addEventListener("click", function (event) {
        if (
          GITHUB_USERNAME === "YOUR_USERNAME" ||
          REPOSITORY_NAME === "YOUR_REPOSITORY"
        ) {
          event.preventDefault();
          alert("لومړی په کوډ کې د خپل GitHub حساب او Repository نوم ولیکه.");
        }
      });

      card.appendChild(top);
      card.appendChild(details);
      card.appendChild(downloadButton);

      return card;
    }

    function renderBooks(filterText) {
      const query = (filterText || "").trim().toLowerCase();

      booksGrid.innerHTML = "";

      let visibleCount = 0;

      for (let number = 1; number <= TOTAL_BOOKS; number++) {
        const title = getBookTitle(number);
        const author = getBookAuthor(number);
        const fileName = "A" + number + ".pdf";

        const searchableText = (
          title + " " +
          author + " " +
          fileName + " " +
          number + " " +
          toPashtoNumber(number)
        ).toLowerCase();

        const matches =
          query === "" ||
          searchableText.indexOf(query) !== -1;

        if (!matches) {
          continue;
        }

        booksGrid.appendChild(createBookCard(number));
        visibleCount++;
      }

      totalBooks.textContent = toPashtoNumber(visibleCount);
      emptyMessage.style.display = visibleCount === 0 ? "block" : "none";
    }

    searchInput.addEventListener("input", function () {
      renderBooks(searchInput.value);
    });

    document.getElementById("currentYear").textContent =
      toPashtoNumber(new Date().getFullYear());

    renderBooks("");

    /*
      د کتابونو د شمېر د ښودلو لپاره:
      په پیل کې ټول ۴۸ کتابونه ښکاره کېږي.
    */
  </script>

</body>
</html>
